version: 2
project_name: hizmetra-kopru

before:
  hooks:
    - go mod tidy
    # NOT: exe ikonu + VERSIONINFO'yu taşıyan cmd/hizmetra-kopru/rsrc_windows_amd64.syso,
    # goreleaser çalışmadan ÖNCE release workflow'undaki "go-winres" adımında üretilir
    # (böylece sürüm etiketten gelir). go build onu main paketinden otomatik linkler.

# NOT (macOS): darwin build'i BURADA YOK — bilerek. fyne.io/systray'in macOS
# arka ucu Cocoa (Objective-C) ve CGO_ENABLED=1 ŞART; ubuntu-latest'te darwin'e
# cgo cross-compile edilemez (osxcross yok). Bu yüzden macOS ikilileri release
# workflow'undaki AYRI "macos" job'ında (macos-latest, CGO_ENABLED=1) plain
# `go build` ile üretilip aynı release'e yüklenir — installer job'ının deseninin
# aynısı. Windows+Linux (ikisi de CGO_ENABLED=0) burada cross-compile edilir.

builds:
  - id: windows
    main: ./cmd/hizmetra-kopru
    binary: hizmetra-kopru
    env:
      - CGO_ENABLED=0
    goos: [windows]
    goarch: [amd64]
    # -H windowsgui: konsol penceresi AÇILMAZ (tepside sessiz çalışır)
    # -s -w: sembol tablosunu at → exe küçülür
    ldflags:
      - -H windowsgui -s -w -X main.Surum={{.Version}}

  - id: linux
    main: ./cmd/hizmetra-kopru
    binary: hizmetra-kopru
    # systray Linux'ta dbus (saf Go) kullanır → cgo GEREKMEZ, cross-compile olur.
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    # -H windowsgui YOK (yalnız Windows'a özgü); -s -w ile ikili küçültülür.
    ldflags:
      - -s -w -X main.Surum={{.Version}}

archives:
  # Çıplak ikili yayınlansın: kafe kullanıcısı zip açmakla uğraşmasın
  # (kurulum 3 dakikada bitsin diye — README'deki 1. adım doğrudan bu dosya).
  #
  # name_template KOŞULLU: Windows'ta "hizmetra-kopru" (+ otomatik .exe uzantısı)
  # = "hizmetra-kopru.exe" — installer job'ı ve README bu ADI birebir bekler,
  # DEĞİŞTİRME. Linux'ta iki mimari çakışmasın diye os+arch eklenir
  # (hizmetra-kopru_linux_amd64 / _linux_arm64).
  - id: cikti
    formats: [binary]
    name_template: 'hizmetra-kopru{{ if ne .Os "windows" }}_{{ .Os }}_{{ .Arch }}{{ end }}'

checksum:
  name_template: "checksums.txt"

changelog:
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: false
  name_template: "Hizmetra Yazıcı {{.Version}}"
  header: |
    ## Kurulum

    1. Aşağıdan **hizmetra-kopru.exe** dosyasını indirin
    2. Çift tıklayın (Windows uyarırsa: **Ek bilgi → Yine de çalıştır**)
    3. Paneldeki **6 haneli kurulum kodunu** girin

    Ayrıntı için [README](https://github.com/kafe-panel/hizmetra-kopru#kurulum-3-dakika).
