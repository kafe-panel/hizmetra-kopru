version: 2
project_name: hizmetra-kopru

before:
  hooks:
    # 'go mod tidy' DEĞİL, 'go mod download': tidy, modül 'go' direktifini bağımlılık
    # graph'ındaki EN YÜKSEK sürüme çeker. github.com/dchest/jsmin (zenity'nin indirect
    # dep'i) 'go 1.23' ister → tidy direktifi 1.23'e yükseltir → eski-Windows (Go 1.20)
    # build'i KIRILIR (Go 1.20 '1.23.1' 3-parçalı formatı ayrıştıramaz). jsmin HİÇBİR
    # build tarafından DERLENMEZ (yalnız graph'ta), o yüzden direktif güvenle 1.20'de
    # kalır; download modül cache'ini hazırlar, go.mod'a DOKUNMAZ. (Bkz. cmd/hizmetra-
    # kopru-eski — Go 1.20 legacy ajanı.)
    - go mod download
    # NOT: exe ikonu + VERSIONINFO'yu taşıyan cmd/hizmetra-kopru/rsrc_windows_amd64.syso,
    # goreleaser çalışmadan ÖNCE release workflow'undaki "go-winres" adımında üretilir
    # (böylece sürüm etiketten gelir). go build onu main paketinden otomatik linkler.

# NOT (macOS): darwin build'i BURADA YOK — bilerek. fyne.io/systray'in macOS
# arka ucu Cocoa (Objective-C) ve CGO_ENABLED=1 ŞART; ubuntu-latest'te darwin'e
# cgo cross-compile edilemez (osxcross yok). Bu yüzden macOS ikilileri release
# workflow'undaki AYRI "macos" job'ında (macos-latest, CGO_ENABLED=1) plain
# `go build` ile üretilip aynı release'e yüklenir — installer job'ının deseninin
# aynısı. Windows+Linux (ikisi de CGO_ENABLED=0) burada cross-compile edilir.

builds:
  - id: windows
    main: ./cmd/hizmetra-kopru
    binary: hizmetra-kopru
    env:
      - CGO_ENABLED=0
    goos: [windows]
    # 386 (32-bit) ZORUNLU, "eski PC" desteği bundan geliyor: sahadaki kafe
    # kasalarının bir kısmı 32-bit Windows 10 kurulu (ucuz/eski donanım) ve
    # amd64 exe orada HİÇ AÇILMAZ — Windows "Bu uygulama bilgisayarınızda
    # çalıştırılamıyor" der; kurulum sorunsuz bittiği için kullanıcı bunu
    # "kurdum ama açılmıyor" diye yaşıyordu (2026-08-20 canlı olay).
    # ARM64 Windows'ta da bu ikili x86 öykünmesiyle çalışır (Win10 ARM64
    # yalnız x86 öykünür, x64'ü öykünmez) → installer 386'yı oraya kurar.
    goarch: [amd64, "386"]
    # -H windowsgui: konsol penceresi AÇILMAZ (tepside sessiz çalışır)
    # -s -w: sembol tablosunu at → exe küçülür
    ldflags:
      - -H windowsgui -s -w -X main.Surum={{.Version}}

  - id: linux
    main: ./cmd/hizmetra-kopru
    binary: hizmetra-kopru
    # systray Linux'ta dbus (saf Go) kullanır → cgo GEREKMEZ, cross-compile olur.
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    # -H windowsgui YOK (yalnız Windows'a özgü); -s -w ile ikili küçültülür.
    ldflags:
      - -s -w -X main.Surum={{.Version}}

archives:
  # Çıplak ikili yayınlansın: kafe kullanıcısı zip açmakla uğraşmasın
  # (kurulum 3 dakikada bitsin diye — README'deki 1. adım doğrudan bu dosya).
  #
  # name_template KOŞULLU: YALNIZ windows/amd64 çıplak "hizmetra-kopru" (+ otomatik
  # .exe uzantısı) = "hizmetra-kopru.exe" — installer job'ı, README ve backend'in
  # indirme haritası bu ADI birebir bekler, DEĞİŞTİRME. Diğer her şey os+arch
  # ekiyle adlandırılır: windows/386 → hizmetra-kopru_windows_386.exe (aksi halde
  # amd64 ile AYNI ada düşer ve biri diğerini ezerdi), linux → _linux_amd64 /
  # _linux_arm64 (eski adlar aynen korunur).
  - id: cikti
    formats: [binary]
    name_template: 'hizmetra-kopru{{ if not (and (eq .Os "windows") (eq .Arch "amd64")) }}_{{ .Os }}_{{ .Arch }}{{ end }}'

# Linux .deb — kafe sahibi için KURULABİLİR paket (ham binary'nin yanında kalır).
# nfpm binary'yi /usr/bin/hizmetra-kopru'ya koyar, autostart .desktop'unu
# /etc/xdg/autostart'a (login'de otomatik başlatma) + uygulama menüsüne kurar,
# ve ikonu hicolor temasına yerleştirir. Her mimari için ayrı .deb üretilir
# (amd64 + arm64), 'linux' build id'sinden türetilerek.
nfpms:
  - id: linux-paket
    package_name: hizmetra-kopru
    # SABİT ad (sürümsüz) → panel "latest/download/hizmetra-kopru_linux_amd64.deb"
    # kararlı linki her sürümde çalışsın (nfpm varsayılanı sürüm-adlı üretir).
    file_name_template: "hizmetra-kopru_{{ .Os }}_{{ .Arch }}"
    ids: [linux]
    vendor: Hizmetra
    homepage: https://github.com/kafe-panel/hizmetra-kopru
    maintainer: Hizmetra <destek@hizmetra.com>
    description: |
      Hizmetra Yazıcı — kafe fiş yazıcılarını Hizmetra Panel'e bağlayan köprü ajanı.
      Panelden gelen fişleri yerel yazıcılara basar; kurulum tek 6 haneli kodla biter.
    license: MIT
    section: utils
    formats:
      - deb
    # Binary varsayılan bindir'e (/usr/bin) hizmetra-kopru adıyla kurulur.
    bindir: /usr/bin
    contents:
      # Login'de otomatik başlatma (XDG autostart, sistem geneli) — "--autostart"
      # bayraklı varyant: uygulama sessiz tepside kalır, pencere pop-up olmaz.
      - src: packaging/linux/hizmetra-kopru-autostart.desktop
        dst: /etc/xdg/autostart/hizmetra-kopru.desktop
      # Uygulama menüsü girdisi (ELLE başlatmak için) — bayraksız: pencere açılır.
      - src: packaging/linux/hizmetra-kopru.desktop
        dst: /usr/share/applications/hizmetra-kopru.desktop
      # Menü/tepsi ikonu (hicolor teması, 256px).
      - src: assets/hizmetra.png
        dst: /usr/share/icons/hicolor/256x256/apps/hizmetra-kopru.png

checksum:
  name_template: "checksums.txt"

changelog:
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: false
  name_template: "Hizmetra Yazıcı {{.Version}}"
  header: |
    ## Kurulum

    **Windows 10 / 11:** Aşağıdan **HizmetraYaziciKurulum.exe** kurulumunu indirin →
    çift tıklayın (Windows uyarırsa: **Ek bilgi → Yine de çalıştır**) → paneldeki
    **6 haneli kodu** girin. Kurulum 64-bit ve **32-bit** Windows'un ikisini de
    kapsar; doğru sürümü kendisi seçer. (Taşınabilir ham ikililer: 64-bit
    **hizmetra-kopru.exe**, 32-bit **hizmetra-kopru_windows_386.exe**.)

    **Windows 7 / 8 / 8.1 (eski):** **HizmetraYaziciKurulum-EskiWindows.exe**
    kurulumunu indirin. Bu sürüm eski Windows'la uyumlu olacak şekilde derlenmiştir
    (arayüz tarayıcıda açılır, tepsi ikonu yoktur); fiş basma aynıdır. 64/32-bit
    otomatik seçilir. (Ham ikililer: **hizmetra-kopru-eski.exe** /
    **hizmetra-kopru-eski_windows_386.exe**.)

    **Mac:** **HizmetraYazici.dmg**'yi indirin → uygulamayı **Applications**'a
    sürükleyin → ilk açılışta **sağ tık → Aç** (imzasız) → **6 haneli kodu** girin.

    **Linux (Debian/Ubuntu):** `sudo apt install ./hizmetra-kopru_*_amd64.deb`
    → menüden başlatın → **6 haneli kodu** girin. (Paket-yöneticisiz için ham
    **hizmetra-kopru_linux_amd64** ikilisi de aşağıdadır.)

    Ayrıntı için [README](https://github.com/kafe-panel/hizmetra-kopru#kurulum-3-dakika).
