name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go test ./...
      # Exe ikonu (assets/hizmetra.ico) + VERSIONINFO — build ÖNCESİ .syso üret.
      # go build, main paketindeki .syso'yu otomatik linkler; sürüm etiketten gelir.
      - name: Exe ikonu + surum bilgisi (go-winres)
        run: |
          VER="${GITHUB_REF_NAME#v}"
          go run github.com/tc-hib/go-winres@latest make \
            --in cmd/hizmetra-kopru/winres/winres.json \
            --arch amd64 \
            --out cmd/hizmetra-kopru/rsrc \
            --product-version "$VER" \
            --file-version "$VER"
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # SignPath onayı gelince buraya imzalama adımı eklenecek:
      # - uses: signpath/github-action-submit-signing-request@v1
