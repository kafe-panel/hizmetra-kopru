name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go test ./...
      # Exe ikonu (assets/hizmetra.ico) + VERSIONINFO — build ÖNCESİ .syso üret.
      # go build, main paketindeki .syso'yu otomatik linkler; sürüm etiketten gelir.
      - name: Exe ikonu + surum bilgisi (go-winres)
        run: |
          VER="${GITHUB_REF_NAME#v}"
          go run github.com/tc-hib/go-winres@latest make \
            --in cmd/hizmetra-kopru/winres/winres.json \
            --arch amd64,386 \
            --out cmd/hizmetra-kopru/rsrc \
            --product-version "$VER" \
            --file-version "$VER"
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # NOT: Kod imzalama scaffold'u (Azure Trusted Signing / SignPath / OV-EV) aşağıdaki
      # "installer" job'ında; primer indirme HizmetraYaziciKurulum.exe orada imzalanır.
      # İstenirse ham hizmetra-kopru.exe de aynı yöntemle burada imzalanabilir.

  # macOS ikilileri (amd64 + arm64). AYRI job + macos-latest ZORUNLU: fyne.io/systray
  # macOS'ta Cocoa (Objective-C) kullanır → CGO_ENABLED=1 ŞART, ubuntu'da darwin'e
  # cgo cross-compile YOK. Bu yüzden .goreleaser.yaml'da darwin build'i yoktur;
  # burada plain `go build` ile üretilip (installer job'ıyla AYNI desen) goreleaser'ın
  # yayınladığı release'e ek asset olarak yüklenir. macos-latest (Apple Silicon)
  # runner'ı evrensel SDK ile hem arm64 (native) hem amd64 (cgo cross) derler.
  macos:
    name: macOS derlemesi (CGO — Cocoa tray)
    needs: goreleaser
    runs-on: macos-latest
    # Apple secret'ları JOB seviyesinde: adım-seviyesi env, o adımın KENDİ
    # `if` koşulunda görünmez (if, env kurulmadan önce değerlendirilir). Secret
    # tanımlı değilse değer boş string olur ve imza/notarize adımları atlanır.
    env:
      APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
      APPLE_CERT_PAROLA: ${{ secrets.APPLE_CERT_PAROLA }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PAROLA: ${{ secrets.APPLE_APP_PAROLA }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      # ─── APPLE İMZA + NOTARIZATION (secret'lar varsa OTOMATİK devreye girer) ───
      # emre 2026-08-21 canlı olay: kafe sahibi .dmg'yi açamadı — macOS "Apple,
      # kötü amaçlı yazılım içermediğini doğrulayamadı" diyor ve macOS 15+'ta
      # "sağ tık → Aç" bypass'ı KALDIRILDIĞI için kullanıcı Sistem Ayarları'ndan
      # elle izin vermek zorunda kalıyor. Bu uyarıyı KALDIRAN TEK ŞEY Developer ID
      # imzası + Apple notarization'dır (ad-hoc imza YETMEZ). Apple Developer
      # Program üyeliği alınıp aşağıdaki secret'lar tanımlandığı ANDA bu adımlar
      # kendiliğinden çalışır; secret yoksa ATLANIR ve imzasız akış aynen sürer.
      #   APPLE_CERT_P12    : Developer ID Application .p12 dosyası (base64)
      #   APPLE_CERT_PAROLA : .p12 dışa aktarma parolası
      #   APPLE_ID          : Apple hesabı e-postası
      #   APPLE_APP_PAROLA  : uygulamaya-özel parola (appleid.apple.com)
      #   APPLE_TEAM_ID     : 10 karakterlik Team ID
      - name: Apple imzalama sertifikasini yukle (secret varsa)
        if: env.APPLE_CERT_P12 != ''
        run: |
          ANAHTARLIK="$RUNNER_TEMP/imza.keychain-db"
          GECICI="$(uuidgen)"
          security create-keychain -p "$GECICI" "$ANAHTARLIK"
          security set-keychain-settings -lut 21600 "$ANAHTARLIK"
          security unlock-keychain -p "$GECICI" "$ANAHTARLIK"
          echo "$APPLE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/sertifika.p12"
          security import "$RUNNER_TEMP/sertifika.p12" -k "$ANAHTARLIK" -P "$APPLE_CERT_PAROLA" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$GECICI" "$ANAHTARLIK" > /dev/null
          security list-keychain -d user -s "$ANAHTARLIK" login.keychain-db
          rm -f "$RUNNER_TEMP/sertifika.p12"
          KIMLIK="$(security find-identity -v -p codesigning "$ANAHTARLIK" | grep 'Developer ID Application' | head -1 | cut -d'"' -f2)"
          echo "IMZA_KIMLIGI=$KIMLIK" >> "$GITHUB_ENV"
          echo "Imza kimligi: $KIMLIK"

      - name: Darwin ikililerini derle (amd64 + arm64, CGO_ENABLED=1)
        env:
          CGO_ENABLED: "1"
        run: |
          VER="${GITHUB_REF_NAME#v}"
          # ⚠️ MACOSX_DEPLOYMENT_TARGET ŞART (2026-08-21 denetimi).
          # CGO_ENABLED=1 → HARİCİ bağlama → Go bağlayıcısı LC_BUILD_VERSION'ı
          # clang'ın ürettiği host object'lerinden KOPYALAR; clang'ın varsayılan
          # deployment target'ı ise RUNNER'IN macOS SÜRÜMÜDÜR. Bu değişken
          # olmadan ikili "yalnız runner'ın macOS'u ve üstünde açılır" damgası
          # taşıyordu → macOS 12/13/14 Intel Mac'lerde uygulama HİÇ AÇILMIYORDU.
          # amd64 = 10.15 (Go 1.22 tabanı), arm64 = 11.0 (Apple Silicon tabanı).
          for arch in amd64 arm64; do
            if [ "$arch" = "amd64" ]; then HEDEF=10.15; else HEDEF=11.0; fi
            MACOSX_DEPLOYMENT_TARGET="$HEDEF" \
            CGO_CFLAGS="-mmacosx-version-min=$HEDEF" \
            CGO_LDFLAGS="-mmacosx-version-min=$HEDEF" \
            GOOS=darwin GOARCH="$arch" go build \
              -ldflags "-s -w -X main.Surum=$VER" \
              -o "hizmetra-kopru_darwin_$arch" \
              ./cmd/hizmetra-kopru
          done
          # DOĞRULAMA — varsayıma güvenme: her dilimin minos'u beklenen mi?
          for arch in amd64 arm64; do
            echo "--- hizmetra-kopru_darwin_$arch"
            vtool -show-build "hizmetra-kopru_darwin_$arch" | grep -E "platform|minos|sdk" || true
          done

      - name: Darwin ikililerini release'e yükle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            hizmetra-kopru_darwin_amd64 \
            hizmetra-kopru_darwin_arm64 \
            --repo "${{ github.repository }}" --clobber

      # .app bundle + .dmg: cafe sahibi için KURULABİLİR paket (ham ikili
      # terminal ister; .dmg "Applications'a sürükle" ile kurulur, LSUIElement
      # tray uygulaması). paket.sh yukarıda üretilen darwin ikililerini lipo ile
      # evrensel yapar, Info.plist + icon.icns'i ekler, imzasız .dmg'yi üretir.
      # (Kod imzalama sertifikası gelince buraya codesign + notarize eklenecek.)
      - name: macOS .app + .dmg paketle
        # MIN_MACOS, ikilinin GERÇEK tabanıyla eşleşmeli (Info.plist yalan beyan
        # etmesin — bkz. Info.plist.template yorumu). Modern kanal = 10.15.
        env:
          MIN_MACOS: "10.15"
          DMG_ADI: HizmetraYazici.dmg
        run: bash packaging/macos/paket.sh "${GITHUB_REF_NAME#v}"

      # DMG_ADI notarize adiminda da lazim.
      - run: echo "DMG_ADI=HizmetraYazici.dmg" >> "$GITHUB_ENV"

      - name: Notarize + staple (secret varsa)
        if: env.APPLE_ID != ''
        run: |
          DMG="dist-macos/$DMG_ADI"
          # --wait: Apple taraması bitene kadar bekle (genelde 1-5 dk).
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --password "$APPLE_APP_PAROLA" --team-id "$APPLE_TEAM_ID" --wait
          # staple: bileti .dmg'ye GÖMER — kullanıcı çevrimdışıyken de uyarısız açılır.
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - name: DMG'yi release'e yükle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            dist-macos/HizmetraYazici.dmg \
            --repo "${{ github.repository }}" --clobber

  # ─── ESKİ macOS (10.13 High Sierra / 10.14 Mojave) — Go 1.20 ile derlenir ───
  # Windows'taki legacy-windows job'ının BİREBİR macOS ikizi. Gerekçe: Go 1.21'den
  # beri üretilen ikililer macOS 10.15+ ister (Go 1.20 release notes: "Go 1.20 is
  # the last release that will run on macOS 10.13 High Sierra or 10.14 Mojave").
  # Modern kanal (Go 1.22) o Mac'lerde HİÇ AÇILMAZ.
  #
  # YALNIZ Intel (amd64): macOS 10.13/10.14 yalnız Intel Mac'lerde vardır; Apple
  # Silicon'ın tabanı zaten Big Sur 11'dir ve onu modern kanal kapsar. Bu yüzden
  # .dmg Intel-only üretilir (paket.sh arm64 ikilisi yoksa tek mimari paketler).
  # `-X main.Kanal=eski`: oto-güncelleme "darwin_eski" anahtarını ister — modern
  # .dmg eski Mac'te çalışmaz. Ajan MODERN bir Mac'te çalışıyorsa (kullanıcı
  # yanlış indirdiyse) moderniDestekliyor() true döner ve modern kanala TERFİ eder.
  legacy-macos:
    name: Eski macOS ikilisi + .dmg (Go 1.20 — 10.13/10.14)
    needs: goreleaser
    runs-on: macos-latest
    # Apple secret'ları JOB seviyesinde: adım-seviyesi env, o adımın KENDİ
    # `if` koşulunda görünmez (if, env kurulmadan önce değerlendirilir). Secret
    # tanımlı değilse değer boş string olur ve imza/notarize adımları atlanır.
    env:
      APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
      APPLE_CERT_PAROLA: ${{ secrets.APPLE_CERT_PAROLA }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PAROLA: ${{ secrets.APPLE_APP_PAROLA }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.20"

      # ─── APPLE İMZA + NOTARIZATION (secret'lar varsa OTOMATİK devreye girer) ───
      # emre 2026-08-21 canlı olay: kafe sahibi .dmg'yi açamadı — macOS "Apple,
      # kötü amaçlı yazılım içermediğini doğrulayamadı" diyor ve macOS 15+'ta
      # "sağ tık → Aç" bypass'ı KALDIRILDIĞI için kullanıcı Sistem Ayarları'ndan
      # elle izin vermek zorunda kalıyor. Bu uyarıyı KALDIRAN TEK ŞEY Developer ID
      # imzası + Apple notarization'dır (ad-hoc imza YETMEZ). Apple Developer
      # Program üyeliği alınıp aşağıdaki secret'lar tanımlandığı ANDA bu adımlar
      # kendiliğinden çalışır; secret yoksa ATLANIR ve imzasız akış aynen sürer.
      #   APPLE_CERT_P12    : Developer ID Application .p12 dosyası (base64)
      #   APPLE_CERT_PAROLA : .p12 dışa aktarma parolası
      #   APPLE_ID          : Apple hesabı e-postası
      #   APPLE_APP_PAROLA  : uygulamaya-özel parola (appleid.apple.com)
      #   APPLE_TEAM_ID     : 10 karakterlik Team ID
      - name: Apple imzalama sertifikasini yukle (secret varsa)
        if: env.APPLE_CERT_P12 != ''
        run: |
          ANAHTARLIK="$RUNNER_TEMP/imza.keychain-db"
          GECICI="$(uuidgen)"
          security create-keychain -p "$GECICI" "$ANAHTARLIK"
          security set-keychain-settings -lut 21600 "$ANAHTARLIK"
          security unlock-keychain -p "$GECICI" "$ANAHTARLIK"
          echo "$APPLE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/sertifika.p12"
          security import "$RUNNER_TEMP/sertifika.p12" -k "$ANAHTARLIK" -P "$APPLE_CERT_PAROLA" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$GECICI" "$ANAHTARLIK" > /dev/null
          security list-keychain -d user -s "$ANAHTARLIK" login.keychain-db
          rm -f "$RUNNER_TEMP/sertifika.p12"
          KIMLIK="$(security find-identity -v -p codesigning "$ANAHTARLIK" | grep 'Developer ID Application' | head -1 | cut -d'"' -f2)"
          echo "IMZA_KIMLIGI=$KIMLIK" >> "$GITHUB_ENV"
          echo "Imza kimligi: $KIMLIK"

      - name: Eski-macOS ikilisini derle (amd64, Go 1.20, hedef 10.13)
        env:
          CGO_ENABLED: "1"
        run: |
          VER="${GITHUB_REF_NAME#v}"
          MACOSX_DEPLOYMENT_TARGET=10.13 \
          CGO_CFLAGS="-mmacosx-version-min=10.13" \
          CGO_LDFLAGS="-mmacosx-version-min=10.13" \
          GOOS=darwin GOARCH=amd64 go build \
            -ldflags "-s -w -X main.Surum=$VER -X main.Kanal=eski" \
            -o "hizmetra-kopru-eski_darwin_amd64" \
            ./cmd/hizmetra-kopru
          echo "--- minos doğrulaması (10.13 bekleniyor)"
          vtool -show-build "hizmetra-kopru-eski_darwin_amd64" | grep -E "platform|minos|sdk" || true

      - name: Eski-macOS .app + .dmg paketle
        env:
          MIN_MACOS: "10.13"
          DMG_ADI: HizmetraYazici-EskiMac.dmg
        # 3. argüman (arm64 ikilisi) BİLEREK verilmiyor → Intel-only paket.
        run: bash packaging/macos/paket.sh "${GITHUB_REF_NAME#v}" hizmetra-kopru-eski_darwin_amd64

      - run: echo "DMG_ADI=HizmetraYazici-EskiMac.dmg" >> "$GITHUB_ENV"

      - name: Notarize + staple (secret varsa)
        if: env.APPLE_ID != ''
        run: |
          DMG="dist-macos/$DMG_ADI"
          # --wait: Apple taraması bitene kadar bekle (genelde 1-5 dk).
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --password "$APPLE_APP_PAROLA" --team-id "$APPLE_TEAM_ID" --wait
          # staple: bileti .dmg'ye GÖMER — kullanıcı çevrimdışıyken de uyarısız açılır.
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - name: Eski-macOS ikilisini ve DMG'yi release'e yükle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            hizmetra-kopru-eski_darwin_amd64 \
            dist-macos/HizmetraYazici-EskiMac.dmg \
            --repo "${{ github.repository }}" --clobber

  # Inno Setup installer (Task C4). AYRI job + windows-latest ZORUNLU: goreleaser
  # yukarıda ubuntu-latest'te CROSS-COMPILE ediyor (CGO_ENABLED=0, GOOS=windows) —
  # iscc.exe Windows-only olduğu için aynı job'da çalışamaz. goreleaser'ın az önce
  # yayınladığı release'den ham hizmetra-kopru.exe'yi indirip installer'a gömer,
  # sonucu AYNI release'e ikinci bir asset olarak yükler (ham exe de KALIR).
  installer:
    name: Inno Setup installer
    needs: goreleaser
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Sürüm PİNLİ: Türkçe (Turkish.isl) Inno Setup 6.5+ ile RESMİ gelir; 6.7.1
      # bunu içerir ve yerelde 6.7.x ile derleme doğrulandı. Pin = tekrarlanabilir
      # yayın (gelecekteki bir 7.x .isl yolunu/Pascal API'sini değiştirip sessizce
      # bozmasın). Bump gerekirse: yerelde iscc ile derleyip doğrula, sonra yükselt.
      - name: Inno Setup kur (chocolatey ön-kurulu, sürüm pinli)
        run: choco install innosetup --version=6.7.1 -y --no-progress

      # HER İKİ mimari de indirilir: installer ikisini de taşır, kurarken makineye
      # uygun olanı yazar (bkz. hizmetra-yazici.iss [Files] Check: IsX64Compatible).
      # --pattern bir GLOB'dur ve "hizmetra-kopru.exe" 386 dosyasını KAPSAMAZ →
      # ayrı satır ŞART; eksik kalırsa iscc "dosya bulunamadı" ile patlar.
      - name: goreleaser'ın yayınladığı Windows ikililerini indir (amd64 + 386)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --pattern "hizmetra-kopru.exe" --dir installer --clobber
          gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --pattern "hizmetra-kopru_windows_386.exe" --dir installer --clobber

      - name: Installer derle (iscc — sürüm etiketten /D ile geçer)
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v', ''
          iscc "/DMyAppVersion=$ver" installer\hizmetra-yazici.iss

      # ─── KOD İMZALAMA (SmartScreen "bilinmeyen yayıncı" uyarısını kaldırır) ───
      # İmzasız .exe her indiren için SmartScreen uyarısı gösterir. İMZA = güven.
      # KARAR VERİLİNCE aşağıdaki adımlardan BİRİNİ etkinleştir (yorumu kaldır) ve
      # ilgili secret'ları ayarla. İmzalama installer'ı ÜRETTİKTEN sonra, YÜKLEMEDEN
      # önce yapılır. (İstenirse aynı adımla ham hizmetra-kopru.exe de imzalanabilir.)
      #
      # SEÇENEK A — Azure Trusted Signing (~$10/ay, Microsoft, hızlı onay, en iyi
      #             SmartScreen itibarı). ÖNERİLEN.
      # - name: Installer'ı imzala (Azure Trusted Signing)
      #   uses: azure/trusted-signing-action@v0
      #   with:
      #     azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
      #     azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
      #     azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
      #     endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}      # ör. https://eus.codesigning.azure.net
      #     trusted-signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
      #     certificate-profile-name: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
      #     files-folder: installer\Output
      #     files-folder-filter: exe
      #
      # SEÇENEK B — SignPath.io (ücretsiz OSS; başvuru onayı haftalar sürebilir):
      # - uses: signpath/github-action-submit-signing-request@v1
      #   with: { ... SignPath organizasyon/proje/imza-politikası ... }
      #
      # SEÇENEK C — Klasik OV/EV sertifikası (~$200-400/yıl) + signtool.exe adımı.

      - name: Installer'ı release asset'i olarak yükle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "installer\Output\HizmetraYaziciKurulum.exe" --repo "${{ github.repository }}" --clobber

  # ─── ESKİ WINDOWS (Win7 SP1 / 8 / 8.1) ikilileri — Go 1.20 ile derlenir ───
  # AYRI job + Go 1.20 ZORUNLU: modern goreleaser job'ı Go 1.22 kullanır ve ürettiği
  # ikili Windows 10+ ister (Go 1.21'den beri Win7/8 desteği kalktı). Bu job AYNI
  # `cmd/hizmetra-kopru`yu (TAM uygulama: systray + WebView2 native pencere + oto-
  # güncelleme; WebView2 yoksa tarayıcı düşüşü) Go 1.20 ile derler → Win7 SP1'den
  # itibaren çalışır ve Win10/11'de MODERN sürümle AYNI native pencereyi açar (emre
  # 2026-08-20: "eski sürüm tarayıcıda açılıyor, uygulama bilgisayarda olmalı").
  # `-X main.Kanal=eski`: oto-güncelleme MODERN yerine ESKİ installer'ı indirir
  # (windows_eski anahtarı). CGO gerekmez (Windows'ta systray saf Win32), ubuntu'da
  # cross-compile edilir. Modern build'i BOZMAZ: go.mod aynı (x/sys v0.17'ye pinli).
  legacy-windows:
    name: Eski Windows ikilileri (Go 1.20 — Win7/8/8.1)
    needs: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Exe ikonu + VERSIONINFO (.syso) YENİ Go ile üretilir (go-winres@latest eski
      # Go'da derlenmeyebilir); Go 1.20 yalnız hazır .syso'yu linkler. Modern
      # goreleaser job'ıyla aynı adım — pencere/görev-çubuğu ikonu için ŞART
      # (IconId=1, bkz. internal/pencere; olmadan jenerik ikon).
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Exe ikonu + surum bilgisi (go-winres)
        run: |
          VER="${GITHUB_REF_NAME#v}"
          go run github.com/tc-hib/go-winres@latest make \
            --in cmd/hizmetra-kopru/winres/winres.json \
            --arch amd64,386 \
            --out cmd/hizmetra-kopru/rsrc \
            --product-version "$VER" \
            --file-version "$VER"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.20"
      - name: Eski-Windows ikililerini derle (modern cmd, Go 1.20, Kanal=eski)
        env:
          CGO_ENABLED: "0"
        run: |
          VER="${GITHUB_REF_NAME#v}"
          GOOS=windows GOARCH=amd64 go build -ldflags "-H windowsgui -s -w -X main.Surum=$VER -X main.Kanal=eski" -o hizmetra-kopru-eski.exe ./cmd/hizmetra-kopru
          GOOS=windows GOARCH=386   go build -ldflags "-H windowsgui -s -w -X main.Surum=$VER -X main.Kanal=eski" -o hizmetra-kopru-eski_windows_386.exe ./cmd/hizmetra-kopru
      - name: Eski-Windows ikililerini release'e yükle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            hizmetra-kopru-eski.exe \
            hizmetra-kopru-eski_windows_386.exe \
            --repo "${{ github.repository }}" --clobber

  # ─── ESKİ WINDOWS installer (Inno Setup, Win10 kapısı YOK) ───
  # AYRI job + windows-latest ZORUNLU: iscc.exe yalnız Windows. legacy-windows'un
  # yüklediği eski ikilileri indirip hizmetra-yazici-eski.iss ile paketler
  # (MinVersion=6.1sp1, WebView2 adımı yok), HizmetraYaziciKurulum-EskiWindows.exe
  # olarak AYNI release'e yükler.
  legacy-installer:
    name: Eski Windows installer (Inno Setup)
    needs: legacy-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inno Setup kur (sürüm pinli — modern installer job ile aynı)
        run: choco install innosetup --version=6.7.1 -y --no-progress
      - name: Eski-Windows ikililerini indir (amd64 + 386)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --pattern "hizmetra-kopru-eski.exe" --dir installer --clobber
          gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --pattern "hizmetra-kopru-eski_windows_386.exe" --dir installer --clobber
      - name: Eski-Windows installer derle (iscc)
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v', ''
          iscc "/DMyAppVersion=$ver" installer\hizmetra-yazici-eski.iss
      - name: Eski-Windows installer'ı release'e yükle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "installer\Output\HizmetraYaziciKurulum-EskiWindows.exe" --repo "${{ github.repository }}" --clobber
