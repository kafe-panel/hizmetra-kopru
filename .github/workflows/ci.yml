name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go vet ./...
      - run: go test ./... -race
      # Asıl hedef Windows — derlemenin bozulmadığını her PR'da doğrula.
      - run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build ./...
      # Linux + macOS de desteklenir (CUPS baskı/keşif). Cross-compile'ın
      # bozulmadığını her PR'da doğrula. macOS'un cmd paketi systray-cgo ister
      # (bkz. release.yml "macos" job) → burada YALNIZ internal/... (CUPS kodu
      # dahil) cgo'suz derlenir; tam macOS ikilisi release'de macos-latest'te üretilir.
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ./...
      - run: CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build ./internal/...
